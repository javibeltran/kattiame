<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>kattia | Visual Practice</title>
  
<!-- Icono universal forzado (evita la caché antigua) -->
  <link rel="icon" type="image/png" href="icon.png?v=2">
  <link rel="shortcut icon" href="icon.png?v=2" type="image/x-icon">
  <link rel="apple-touch-icon" href="icon.png?v=2">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      position: relative;
    }

    /* Vídeo centrado */
    video {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      z-index: 1;
    }

    /* Botón rescatado: elevado y forzado al frente */
    #sound-btn {
      position: fixed;
      bottom: 45px; /* Subido a 45px para que la barra del móvil jamás lo tape */
      right: 20px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.5);
      color: #fff;
      padding: 10px 16px;
      border-radius: 30px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      letter-spacing: 1px;
      cursor: pointer;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 999999; /* Máxima prioridad sobre el vídeo */
      -webkit-tap-highlight-color: transparent;
    }

    #sound-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <video id="myVideo" autoplay loop muted playsinline webkit-playsinline preload="auto">
    <source src="video.mp4" type="video/mp4">
    Tu navegador no soporta reproducción de vídeo.
  </video>

  <!-- Botón interactivo de audio -->
  <button id="sound-btn" type="button">SOUND OFF</button>

  <script>
    const video = document.getElementById('myVideo');
    const soundBtn = document.getElementById('sound-btn');

    soundBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (video.muted) {
        video.muted = false;
        soundBtn.textContent = 'SOUND ON';
      } else {
        video.muted = true;
        soundBtn.textContent = 'SOUND OFF';
      }
    });
  </script>

</body>
</html>
