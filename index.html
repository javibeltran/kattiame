<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kattia | Visual Practice</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      position: relative;
    }

    /* Centrado matemático absoluto del vídeo */
    video {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Botón flotante corregido para móviles */
    #sound-btn {
      position: fixed; /* 'fixed' evita que se mueva al hacer scroll en móvil */
      bottom: calc(25px + env(safe-area-inset-bottom)); /* Respeta el margen de la barra del móvil */
      right: 25px;
      background: rgba(0, 0, 0, 0.7); /* Algo más oscuro para mejorar legibilidad */
      border: 1px solid rgba(255, 255, 255, 0.5);
      color: #fff;
      padding: 10px 16px;
      border-radius: 30px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      letter-spacing: 1px;
      cursor: pointer;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 9999; /* Asegura que esté SIEMPRE por encima de todo */
      -webkit-tap-highlight-color: transparent;
    }

    #sound-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <video id="myVideo" autoplay loop muted playsinline webkit-playsinline preload="auto">
    <source src="video.mp4" type="video/mp4">
    Tu navegador no soporta reproducción de vídeo.
  </video>

  <!-- Botón interactivo de audio -->
  <button id="sound-btn">SOUND OFF</button>

  <script>
    const video = document.getElementById('myVideo');
    const soundBtn = document.getElementById('sound-btn');

    soundBtn.addEventListener('click', () => {
      if (video.muted) {
        video.muted = false;
        soundBtn.textContent = 'SOUND ON';
      } else {
        video.muted = true;
        soundBtn.textContent = 'SOUND OFF';
      }
    });
  </script>

</body>
</html>
