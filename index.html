<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kattia | Visual Practice</title>
  
  <!-- Bloque de Favicon Multi-dispositivo -->
  <link rel="icon" type="image/png" sizes="32x32" href="icon.png?v=3">
  <link rel="icon" type="image/png" sizes="16x16" href="icon.png?v=3">
  <link rel="shortcut icon" href="icon.png?v=3" type="image/x-icon">
  <link rel="apple-touch-icon" sizes="180x180" href="icon.png?v=3">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      position: relative;
    }

    /* Vídeo forzado a ocupar la pantalla completa sin franjas */
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover; /* Escala y cubre toda la pantalla eliminando franjas */
      display: block;
      z-index: 1;
    }

    /* Botón en blanco translúcido */
    #sound-btn {
      position: fixed;
      bottom: 35px;
      right: 45px;
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid rgba(0, 0, 0, 0.12);
      color: rgba(0, 0, 0, 0.75);
      padding: 6px 12px;
      border-radius: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 999999;
      transition: all 0.3s ease;
      -webkit-tap-highlight-color: transparent;
    }

    #sound-btn:hover {
      background: rgba(255, 255, 255, 0.9);
      border-color: rgba(0, 0, 0, 0.25);
      color: #000000;
    }
  </style>
</head>
<body>

  <video id="myVideo" autoplay loop muted playsinline webkit-playsinline preload="auto">
    <source src="video.mp4" type="video/mp4">
    Tu navegador no soporta reproducción de vídeo.
  </video>

  <!-- Botón interactivo de audio -->
  <button id="sound-btn" type="button">SOUND OFF</button>

  <script>
    const video = document.getElementById('myVideo');
    const soundBtn = document.getElementById('sound-btn');

    soundBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (video.muted) {
        video.muted = false;
        soundBtn.textContent = 'SOUND ON';
      } else {
        video.muted = true;
        soundBtn.textContent = 'SOUND OFF';
      }
    });
  </script>

</body>
</html>
