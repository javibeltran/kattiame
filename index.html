<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kattia | Visual Practice</title>
  <style>
    /* Reseteo básico para eliminar márgenes predeterminados */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Asegura que el cuerpo ocupe todo el alto de la pantalla sin scroll */
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000; /* Fondo negro para las barras */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Configuración del vídeo para que sea visible por completo */
    video {
      /* Ocupa el máximo posible sin recortarse (contain) */
      max-width: 100%;
      max-height: 100%;
      /* Centra el vídeo si quedan barras negras */
      object-fit: contain; 
    }
  </style>
</head>
<body>
  <!-- Mantenemos 'muted' para asegurar la reproducción automática -->
  <video autoplay loop muted playsinline webkit-playsinline preload="auto">
    <source src="video.mp4" type="video/mp4">
    Tu navegador no soporta reproducción de vídeo.
  </video>
</body>
</html>
