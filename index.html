<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kattia | Visual Practice</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    /* Contenedor principal a pantalla completa */
    .video-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Tu vídeo centrado */
    video {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* Tu botón original exacto, adaptado para móviles */
    #sound-btn {
      position: absolute;
      bottom: max(25px, env(safe-area-inset-bottom));
      right: max(25px, env(safe-area-inset-right));
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      padding: 10px 16px;
      border-radius: 30px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      letter-spacing: 1px;
      cursor: pointer;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 99;
      transition: all 0.3s ease;
      -webkit-tap-highlight-color: transparent;
    }

    #sound-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <div class="video-container">
    <video id="myVideo" autoplay loop muted playsinline webkit-playsinline preload="auto">
      <source src="video.mp4" type="video/mp4">
      Tu navegador no soporta reproducción de vídeo.
    </video>

    <!-- Botón de sonido original -->
    <button id="sound-btn">SOUND OFF</button>
  </div>

  <script>
    const video = document.getElementById('myVideo');
    const soundBtn = document.getElementById('sound-btn');

    soundBtn.addEventListener('click', () => {
      if (video.muted) {
        video.muted = false;
        soundBtn.textContent = 'SOUND ON';
      } else {
        video.muted = true;
        soundBtn.textContent = 'SOUND OFF';
      }
    });
  </script>

</body>
</html>
