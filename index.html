Aquí tienes el archivo index.html completo y consolidado. Incluye el fondo blanco para eliminar las franjas negras externas, el botón de sonido estilizado (más pequeño, minimalista y transparente), y las etiquetas necesarias para cargar el icono icon.png:

HTML
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kattia | Visual Practice</title>
  
  <!-- Bloque de Favicon Multi-dispositivo -->
  <link rel="icon" type="image/png" sizes="32x32" href="icon.png?v=3">
  <link rel="icon" type="image/png" sizes="16x16" href="icon.png?v=3">
  <link rel="shortcut icon" href="icon.png?v=3" type="image/x-icon">
  <link rel="apple-touch-icon" sizes="180x180" href="icon.png?v=3">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff; /* Franjas y fondo general en blanco */
      position: relative;
    }

    /* Vídeo centrado sobre fondo blanco */
    video {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      z-index: 1;
      background-color: #ffffff; /* Marco del reproductor en blanco */
    }

    /* Botón minimalista: más pequeño, translúcido y con tipografía fina */
    #sound-btn {
      position: fixed;
      bottom: 35px;
      right: 25px;
      background: rgba(0, 0, 0, 0.25); /* Transparencia sutil */
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: rgba(255, 255, 255, 0.9);
      padding: 6px 12px; /* Tamaño compacto */
      border-radius: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      font-size: 10px; /* Letra pequeña y estética */
      font-weight: 400;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(8px); /* Desenfoque traslúcido */
      -webkit-backdrop-filter: blur(8px);
      z-index: 999999;
      transition: all 0.3s ease;
      -webkit-tap-highlight-color: transparent;
    }

    #sound-btn:hover {
      background: rgba(0, 0, 0, 0.5);
      border-color: rgba(255, 255, 255, 0.7);
      color: #ffffff;
    }
  </style>
</head>
<body>

  <video id="myVideo" autoplay loop muted playsinline webkit-playsinline preload="auto">
    <source src="video.mp4" type="video/mp4">
    Tu navegador no soporta reproducción de vídeo.
  </video>

  <!-- Botón interactivo de audio -->
  <button id="sound-btn" type="button">SOUND OFF</button>

  <script>
    const video = document.getElementById('myVideo');
    const soundBtn = document.getElementById('sound-btn');

    soundBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (video.muted) {
        video.muted = false;
        soundBtn.textContent = 'SOUND ON';
      } else {
        video.muted = true;
        soundBtn.textContent = 'SOUND OFF';
      }
    });
  </script>

</body>
</html>
