<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kattia.me</title>
  <style>
    /* Reset total de márgenes, rellenos y bordes */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #000;
      overflow: hidden;
      position: relative;
    }

    /* Centrado matemático absoluto respecto al centro del navegador */
    img, video {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Reemplaza "tu-imagen.jpg" por el nombre de tu archivo -->
  <img src="tu-imagen.jpg" alt="Portada kattia.me">

</body>
</html>
